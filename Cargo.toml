[package]
name = "w-connect"
version = "0.2.0"
edition = "2021"
description = "Lightweight local Lian Li fan and lighting control"
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
hidapi = "2"

[profile.release]
lto = true
strip = true
codegen-units = 1
